<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CITROËN C3 // TELEMETRIA DE CONSUMO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #F6F5F2; color: #111111; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .citroen-red { color: #E1251B; }
    .bg-citroen-red { background-color: #E1251B; }
    .bg-citroen-red:hover { background-color: #B81D15; }
    .border-crisp { border: 1px solid #E2E0D8; }
    input:focus, select:focus { outline: none; border-color: #111111; }
  </style>
</head>
<body class="min-h-screen p-4 md:p-10 antialiased">

  <div class="max-w-5xl mx-auto space-y-8">
    
    <!-- Top Bar Atualizada (v1.0.0) -->
    <header class="bg-white border-crisp p-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div class="flex items-start gap-4">
        <div class="w-1.5 h-12 bg-citroen-red"></div>
        <div>
          <div class="flex items-center gap-2">
            <span class="text-[11px] font-bold tracking-widest uppercase text-neutral-400">SPEC // V1.0.0</span>
            <span id="badgeAtual" class="text-[11px] mono bg-neutral-100 px-2 py-0.5 font-semibold uppercase">ATUAL: --</span>
          </div>
          <h1 class="text-2xl md:text-3xl font-bold tracking-tight mt-0.5">C3 - Abastecimento</h1>
        </div>
      </div>
      <div class="flex items-center gap-2 self-start md:self-center border border-neutral-200 px-3 py-1.5 bg-[#FAF9F6]">
        <span class="w-2 h-2 rounded-full bg-emerald-600" id="dotSync"></span>
        <span id="statusSync" class="text-xs font-medium uppercase tracking-wider text-neutral-600 mono">ONLINE</span>
      </div>
    </header>

    <!-- Grid Principal: Telemetria + Input -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- Formulário de Registro -->
      <form id="fuelForm" class="lg:col-span-5 bg-white border-crisp p-6 flex flex-col justify-between space-y-5">
        <div>
          <div class="flex justify-between items-center border-b border-neutral-200 pb-3 mb-5">
            <h2 class="text-xs font-bold uppercase tracking-widest text-neutral-500">01 / Parâmetros da Bomba</h2>
            <span class="text-xs mono text-neutral-400">INPUT</span>
          </div>

          <div class="space-y-4">
            <div>
              <label class="block text-xs font-semibold uppercase tracking-wider text-neutral-500 mb-1.5">Matriz Energética</label>
              <select id="combustivel" class="w-full bg-[#FAF9F6] border border-neutral-300 px-3.5 py-2.5 text-sm font-medium transition">
                <option value="Gasolina">Gasolina Comum / Aditivada
